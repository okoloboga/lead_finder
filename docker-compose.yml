services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    tty: true
    stdin_open: true
    command: python run_bot.py
    environment:
      - PYTHONPATH=.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      xray:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    command: celery -A bot.celery_app.celery_app worker --pool=solo --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-1}
    environment:
      - PYTHONPATH=.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      xray:
        condition: service_started

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - leadcore_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - leadcore_redis

  # VLESS tunnel: Telegram is not reachable directly from this host's containers.
  xray:
    image: ghcr.io/core-euler/sna_net-xray_proxy:main-9256bf2
    restart: unless-stopped
    volumes:
      - ./xray-config.json:/etc/xray/config.json:ro

volumes:
  postgres_data:
